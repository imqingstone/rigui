<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="format-detection" content="telephone=no"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6e8cf"><meta name="description" content="日晷，替旅人排一天。把旅人的行程排進十二個時辰，排得順應時辰，值班的官就會亮起來。"><title>日晷・替旅人排一天</title><meta property="og:type" content="website"><meta property="og:title" content="日晷・替旅人排一天"><meta property="og:description" content="每天一題的排行程小遊戲：把旅人的行程排進十二個時辰。"><meta property="og:url" content="https://imqingstone.github.io/rigui/"><meta property="og:image" content="https://imqingstone.github.io/rigui/img/og.jpg?v=1"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="日晷"><link rel="icon" type="image/png" href="icon-192.png"><link rel="preload" as="image" href="img/hero-tall.jpg" media="(max-aspect-ratio: 1/1)"><link rel="preload" as="image" href="img/hero-wide.jpg" media="(min-aspect-ratio: 1/1)"><link rel="stylesheet" href="style.css"></head>
<body>
<a class="skip" href="#main">跳到主要內容</a>
<header class="top">
  <div class="brand"><b>日晷</b><span>替旅人排一天</span></div>
  <div class="when"><span id="date"></span><b id="term"></b><span id="season" class="season"></span></div>
</header>

<main id="main" tabindex="-1">
  <nav class="modes" aria-label="模式">
    <button id="tab-daily" type="button" aria-pressed="true">今日一題</button>
    <button id="tab-practice" type="button" aria-pressed="false">練習</button>
    <button id="tab-collect" type="button" aria-pressed="false">收藏</button>
    <button id="tab-help" type="button" aria-pressed="false">說明</button>
  </nav>
  <p class="mode-note" id="mode-note"></p>
  <div id="game-view">
  <section class="traveler" id="traveler" aria-live="polite"></section>

  <section class="dial-wrap" aria-label="日晷：十二時辰">
    <div class="dial" id="dial">
      <svg class="face" viewBox="0 0 400 400" aria-hidden="true" id="face"></svg>
      <div class="center" id="center"><span class="gnomon" id="gnomon"></span><span class="center-text" id="center-text"></span></div>
    </div>
    <p class="sun" id="sun"></p>
  </section>

  <p class="info" id="info" aria-live="polite"></p>

  <section class="tray-wrap" id="tray-wrap">
    <h2>今天的行程</h2>
    <p class="tray-hint" id="tray-hint"></p>
    <div class="tray" id="tray"></div>
    <div class="actions">
      <button id="btn-clear" class="ghost" type="button">全部收回</button>
      <button id="btn-skip" class="ghost" type="button" hidden>換一題</button>
      <button id="btn-done" class="primary" type="button">定案</button>
    </div>
  </section>

  <section class="result" id="result" hidden>
    <p class="rank-kind">這一天排好了</p>
    <h2 id="r-rank"></h2>
    <p class="score"><b id="r-total"></b><span> / </span><span id="r-max"></span></p>
    <p class="need" id="r-need"></p>
    <p class="record" id="r-record" hidden></p>
    <div class="share" id="r-share">
      <label for="share-text">分享結果（不會透露排法）</label>
      <textarea id="share-text" rows="5" readonly></textarea>
      <button id="btn-copy" class="primary" type="button">複製結果</button>
    </div>
    <ol class="cells" id="r-cells"></ol>
    <p class="source" id="r-source"></p>
    <div class="actions"><button id="btn-again" class="ghost" type="button">再排一次</button><button id="btn-next" class="primary" type="button" hidden>換一題</button></div>
  </section>
  </div>

  <div id="help-view" class="help" hidden></div>

  <div id="collect-view" hidden>
    <section class="box">
      <h2>驛站庭院</h2>
      <svg class="garden" id="garden" viewBox="0 0 360 190" role="img" aria-labelledby="garden-desc"></svg>
      <p class="garden-text" id="garden-desc"></p>
    </section>

    <section class="box">
      <h2>節氣圖鑑 <small id="term-count"></small></h2>
      <p class="hint">在某個節氣期間玩過今日一題，就收錄那一頁。練習不會收錄。</p>
      <div class="detail" id="term-detail" hidden></div>
      <div class="grid terms" id="term-grid"></div>
      <p class="source" id="hou-source"></p>
    </section>

    <section class="box">
      <h2>旅人圖鑑 <small id="trav-count"></small></h2>
      <div class="detail" id="trav-detail" hidden></div>
      <div class="grid travelers" id="trav-grid"></div>
    </section>

    <section class="box">
      <h2>進度備份</h2>
      <p class="hint">進度只保存在這個瀏覽器。換手機或清除瀏覽器資料前，請先匯出備份。</p>
      <div class="actions"><button id="btn-export" class="ghost" type="button">匯出進度</button><button id="btn-import" class="ghost" type="button">匯入進度</button></div>
      <input id="file-import" type="file" accept="application/json,.json" hidden>
      <div class="confirm" id="import-confirm" hidden>
        <p>匯入後會取代目前的進度，確定嗎？</p>
        <div class="actions"><button id="btn-import-no" class="ghost" type="button">取消</button><button id="btn-import-yes" class="primary" type="button">確定匯入</button></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <p><span class="seg">本遊戲是古代經典的文化介紹，</span><span class="seg">不構成任何醫療或健康建議。</span></p>
  <small id="usage" class="usage" hidden></small>
  <a class="home-link" href="https://imqingstone.github.io/"><img src="qingstone.png" alt="" width="28" height="28"><span>回到青石驛</span></a>
  <small class="copyright"><span class="seg">© 2026 日晷・古文屬公有領域，</span><span class="seg">其餘內容為原創，未經同意請勿轉載</span></small>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="terms.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script data-goatcounter="https://imqingstone.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body></html>
